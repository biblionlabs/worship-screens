- name: Run sccache-cache
  uses: mozilla-actions/sccache-action@v0.0.9

- name: Install GStreamer (Linux / apt)
  if: runner.os == 'Linux'
  run: |
    sudo apt-get update
    sudo apt-get install -y \
      pkg-config \
      libglib2.0-dev \
      libunwind-dev \
      libgstreamer1.0 \
      libgstreamer-plugins-base1.0 \
      libgstreamer-plugins-bad1.0 \
      gstreamer1.0-gl \
      gstreamer1.0-tools \
      gstreamer1.0-plugins-base \
      gstreamer1.0-plugins-good \
      gstreamer1.0-plugins-bad \
      gstreamer1.0-libav

    # Sanity check
    gst-launch-1.0 --version

- name: Install GStreamer (macOS / Homebew)
  if: runner.os == 'macOS'
  run: |
    brew update

    brew install \
      glib \
      gstreamer \
      gst-plugins-base \
      gst-plugins-good \
      gst-plugins-bad \
      gst-libav \
      pkg-config

    echo "$(brew --prefix)/bin" >> $GITHUB_PATH
    echo "$(brew --prefix)/lib/pkgconfig" >> $GITHUB_PATH

- name: Install GStreamer (windows)
  if: runner.os == 'Windows'
  uses: marcpabst/setup-gstreamer@v.1.5.3
  with:
    version: '1.26.10'

- name: List Window Libs
  if: runner.os == 'Windows'
  run: ls D:/gstreamer/1.0/msvc_x86_64/lib
